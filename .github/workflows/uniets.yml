name: Python CI Pipeline
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pandas openpyxl plotly matplotlib seaborn streamlit
      - name: Run Modular Tests
        run: |
          # This ensures all your src scripts can be imported without errors
          python -c "import sys; sys.path.append('src'); import data_loader, visualizer, modeller, forecaster"